<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIVORA EATS login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-page">
        <img class="login-background" src="login_background.jpeg" alt="login-background image">
        <div class="login-card">
            <h2 class="login-header">Login</h2>
            <p class="login-subtext">Don't have an account? <a href=" ">Create account</a></p>
            <div class="login-input">
                <input class="login-info" type="email" placeholder="Enter Email" required>
                <input class="login-info" type="password" placeholder="Enter Password" required>
                <button class="login-card-button">Login</button>
            </div>
            <p class="forgot-password">Forgot Password?</p>
        </div>
    </div>
</body>
</html>
